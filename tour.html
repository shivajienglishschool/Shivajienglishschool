<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Campus Tour | Shivaji English School</title>
  
  <!-- Linking Master Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Local Styles for Tour Page */
    .tour-header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .tour-header h1 {
      color: white;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .tour-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .media-card {
      background: var(--bg-card);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
    }

    .media-card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: var(--primary-dark);
    }

    .media-card i {
      color: var(--accent);
    }

    video, iframe {
      width: 100%;
      border-radius: 12px;
      border: none;
      background: #0f172a;
    }

    iframe {
      height: 450px;
    }
  </style>
</head>
<body>

  <!-- Universal Navigation Bar -->
  <header class="main-header">
    <div class="nav-container">
      <a href="home.html" style="text-decoration: none;">
        <div class="college-name">SHIVAJI ENGLISH SCHOOL</div>
      </a>
      <ul class="nav-list">
        <li><a href="home.html" class="nav-link">Home</a></li>
        <li><a href="academics.html" class="nav-link">Academics</a></li>
        <li><a href="events.html" class="nav-link">Events</a></li>
        <li><a href="tour.html" class="nav-link" style="color: var(--accent);">Campus Tour</a></li>
        <li><a href="gallery.html" class="nav-link">Gallery</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </header>

  <div class="page-wrapper">
    <!-- Header -->
    <div class="tour-header">
      <h1>Virtual Campus Tour</h1>
      <p style="color: var(--accent); font-weight: bold; letter-spacing: 1px;"><i class="fa-solid fa-map-location-dot"></i> Explore Our College Campus</p>
    </div>

    <!-- Tour Content -->
    <div class="tour-container">
      
      <!-- Video Section -->
      <div class="media-card">
        <h2><i class="fa-solid fa-video"></i> Campus Walkthrough Video</h2>
        <video controls poster="https://images.unsplash.com/photo-1562774053-701939374585?w=1000">
          <source src="campus.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>

      <!-- Map Section -->
      <div class="media-card">
        <h2><i class="fa-solid fa-location-dot"></i> Google Maps Location</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15330.123456789!2d73.684123456789!3d16.0023456789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTbCsDAwJzA4LjQiTiA3M8KwNDEnMDMuMCJF!5e0!3m2!1sen!2sin!4v1690000000000!5m2!1sen!2sin" loading="lazy"></iframe>
      </div>

    </div>
  </div>

  <!-- Global Script for AI Assistant -->
  <script src="script.js"></script>
</body>
</html>
