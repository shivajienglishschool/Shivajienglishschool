<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Shivaji English School</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Same light blue background as index.html */
    body.login-body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      padding: 20px;
      font-family: var(--font-base);
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.1);
      padding: 40px;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .login-header { text-align: center; margin-bottom: 20px; }
    .login-header i { font-size: 45px; color: #1a365d; margin-bottom: 15px; }
    .login-header h1 { font-family: var(--font-heading); color: #0f172a; font-size: 22px; line-height: 1.2; margin: 0; }
    .login-header p { color: #d97706; font-weight: 800; font-size: 12px; letter-spacing: 1px; margin-top: 8px; }
    
    .title-box { text-align: center; font-size: 18px; font-weight: 800; font-family: var(--font-heading); margin-bottom: 25px; color: #0f172a; }

    .form-group { margin-bottom: 15px; }
    .form-control { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: var(--font-base); font-size: 14px; outline: none; transition: 0.3s; background: #f8fafc; }
    .form-control:focus { border-color: #1a365d; background: #ffffff; box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1); }

    .forgot { text-align: right; margin-bottom: 20px; font-size: 13px; }
    .forgot a { color: #d97706; text-decoration: none; font-weight: 700; }
    .forgot a:hover { text-decoration: underline; }

    /* Custom Admin Buttons */
    .face-btn { width: 100%; padding: 14px; background: #1a365d; color: white; border: none; border-radius: 10px; font-family: var(--font-base); font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px; }
    .face-btn:hover { background: #0f172a; transform: translateY(-2px); }

    .btn-main { width: 100%; padding: 15px; background: #d97706; color: white; border: none; border-radius: 10px; font-family: var(--font-heading); font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s; }
    .btn-main:hover { background: #b45309; transform: translateY(-2px); }

    /* Back Link */
    .back-link { display: block; text-align: center; margin-top: 25px; font-size: 13px; color: #64748b; text-decoration: none; font-weight: 600; }
    .back-link:hover { color: #1a365d; text-decoration: underline; }
  </style>
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <i class="fa-solid fa-shield-halved"></i>
      <h1>SHIVAJI ENGLISH SCHOOL</h1>
      <p>ADMINISTRATION</p>
    </div>

    <div class="title-box">ADMIN LOGIN</div>

    <form onsubmit="event.preventDefault(); window.location.href='admin-dashboard.html';">
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Admin Username" required>
      </div>
      <div class="form-group">
        <input type="email" class="form-control" placeholder="Admin Email" required>
      </div>
      <div class="form-group">
        <input type="password" class="form-control" placeholder="Password" required>
      </div>
      
      <div class="forgot">
        <a href="#">Forgot Password?</a>
      </div>

      <!-- Admin Specific Features -->
      <button type="button" class="face-btn" onclick="alert('Face Scan Module Initialized...');">
        <i class="fa-solid fa-camera"></i> Face Scan Authentication
      </button>

      <button type="submit" class="btn-main">LOGIN AS ADMIN</button>
    </form>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal</a>
  </div>

</body>
</html>
